    <!-- ─── Search & link previews ───
         These are the homepage values. At build time the seoPages plugin
         (vite.config.js) writes a copy of this file for every page in
         src/data/seo.js with that page's title / description / URL filled in,
         so edit the wording there, not here. -->
    <title>UC Merced Robotics Society | Student Robotics Club at UC Merced</title>
    <meta name="description" content="UC Merced Robotics Society is a student-run robotics club at the University of California, Merced. We build combat robots, a rally kart, a robot arm and an autonomous robot." />

    <link rel="canonical" href="https://robotics-society-ucmerced.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UC Merced Robotics Society" />

    <!-- Tells Google who we are: name, logo, parent university, socials -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "UC Merced Robotics Society",
      "alternateName": ["UCM Robotics Society", "UCM Robotics", "UC Merced Robotics Club"],
      "url": "https://robotics-society-ucmerced.com/",
      "logo": "https://robotics-society-ucmerced.com/logo-512.png",
      "description": "A student-run robotics club at the University of California, Merced, building combat robots, a rally kart, a robot arm and an autonomous robot.",
      "parentOrganization": {
        "@type": "CollegeOrUniversity",
        "name": "University of California, Merced",
        "url": "https://www.ucmerced.edu/"
      },
      "location": {
        "@type": "Place",
        "name": "MESA Labs",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "4225 Hospital Road",
          "addressLocality": "Atwater",
          "addressRegion": "CA",
          "postalCode": "95301",
          "addressCountry": "US"
        }
      },
      "sameAs": [
        "https://www.instagram.com/ucm_rs/",
        "https://www.instagram.com/rs_rallykart/",
        "https://discord.gg/jBS8bJ6rsN"
      ]
    }
    </script>
